<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4fb" />
    <title>You're offline | SignConnect</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f5f4fb;
        color: #0f172a;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      main {
        width: min(100%, 540px);
      }
      img {
        display: block;
        width: min(100%, 300px);
        max-height: 35vh;
        object-fit: contain;
        margin: 0 auto 20px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(28px, 7vw, 40px);
      }
      p {
        color: #64748b;
        line-height: 1.7;
      }
      button {
        min-height: 44px;
        margin-top: 12px;
        padding: 0 24px;
        border: 0;
        border-radius: 12px;
        background: #4b34a0;
        color: white;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/offline-illustration.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Looks like you're not connected to the internet. Check your Wi-Fi or mobile data, then try
        again.
      </p>
      <button type="button" onclick="location.reload()">Try Again</button>
    </main>
  </body>
</html>
